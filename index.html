<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eaf2ff" />
    <title>备份工具</title>
    <link rel="icon" href="./favicon.ico?v=20261030-tools-gold-1" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=20261030-tools-gold-1" sizes="any">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Microsoft YaHei', 'sans-serif'],
            },
            colors: {
              sky: {50:'#f0f2fb',100:'#e1e6f8',200:'#c8d1ef',300:'#acb9e7',400:'#899bd9',500:'#687bd1',600:'#596cc4',700:'#4e5da4',800:'#3f4c83',900:'#343f6d',950:'#25314b'},
              glass: {
                100: 'rgba(255, 255, 255, 0.5)',
                200: 'rgba(255, 255, 255, 0.78)',
                300: 'rgba(255, 255, 255, 0.9)',
                border: 'rgba(255, 255, 255, 0.74)',
                text: '#25314b',
                textMuted: '#64748b',
                ios: '#596cc4',
              }
            },
            backdropBlur: {
              xs: '2px',
            }
          },
        },
      }
    </script>
    <style>
      :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#25314b;background:#edf1f8;font-synthesis:none}
      *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 16% 12%,#c9d7ffb3,transparent 46%),radial-gradient(ellipse at 48% 36%,#e4cfff80,transparent 48%),radial-gradient(ellipse at 82% 8%,#c9eee88c,transparent 42%),linear-gradient(145deg,#f5f7fc,#eaf0f8);background-attachment:fixed;color:#25314b}
      .glass-panel{background:linear-gradient(135deg,#ffffff9c,#ffffff3d);border:1px solid #ffffffbd;border-radius:26px;box-shadow:inset 0 1px 0 #ffffffe6,inset 0 -1px 0 #ffffff4d,0 8px 32px #52678e12,0 2px 6px #52678e08;backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);}
      .glass-modal{background:linear-gradient(135deg,#ffffff9c,#ffffff3d);border:1px solid #ffffffbd;border-radius:26px;box-shadow:inset 0 1px 0 #ffffffe6,inset 0 -1px 0 #ffffff4d,0 8px 32px #52678e12,0 2px 6px #52678e08;backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);background:linear-gradient(135deg,#fffffff0,#f4f6fce8)}
      .glass-inset{background:#ffffff59;border:1px solid #ffffffa6;border-radius:16px}
      .glass-primary{background:linear-gradient(135deg,#687bd1,#596cc4);box-shadow:inset 0 1px 0 #ffffff55,0 5px 16px #596cc426}
      .glass-header{background:#ffffff30;border-bottom:1px solid #ffffff80}
      .tool-nav{max-width:1280px;width:100%;margin:0 auto 24px}.tool-nav a{display:inline-flex;padding:10px 16px;border-radius:16px;border:1px solid #ffffffbd;background:#ffffff70;color:#596cc4;font-size:14px;text-decoration:none;box-shadow:inset 0 1px 0 #fff,0 4px 14px #52678e0c;backdrop-filter:blur(24px)}.tool-nav a:hover{background:#ffffffb3}
      button,input,select{font:inherit}button:focus-visible,a:focus-visible{outline:3px solid #687bd1;outline-offset:3px}
      input:focus-visible{outline:2px solid #687bd1;outline-offset:3px}
      ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#7388bd40;border-radius:10px}
      @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.37.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "vite-plugin-singlefile": "https://esm.sh/vite-plugin-singlefile@^2.3.0"
  }
}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
